[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-governor"
version = "0.1.0"
description = "Safety Governor: a functional model, hypothesis tests and RTL for a chip that says no, one per NVIDIA GPU, added through the rack's boards"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "PolyForm-Noncommercial-1.0.0"}
dependencies = [
  "cryptography>=41",
  "amaranth>=0.5,<0.6",
  "amaranth-yosys",
]

[project.optional-dependencies]
# z3-solver runs the proofs (make proof); it was missing here, so a fresh .venv could not run them
# and wave 2's L3 failed its acceptance on a ModuleNotFoundError, not on its work.
dev = ["pytest>=7", "z3-solver>=4.12", "yowasp-yosys>=0.50"]

[project.scripts]
govsim = "govsim.cli:main"

[tool.setuptools.packages.find]
include = ["govsim*", "rtl*"]

[tool.pytest.ini_options]
addopts = "-q"
