[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-governor"
version = "0.1.0"
description = "Safety Governor: a functional model, hypothesis tests and RTL for a chip that says no, one per NVIDIA GPU, added through the rack's boards"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "PolyForm-Noncommercial-1.0.0"}
dependencies = [
  "cryptography>=41",
  "amaranth>=0.5,<0.6",
  "amaranth-yosys",
]

[project.optional-dependencies]
# z3-solver runs the proofs (make proof); it was missing here, so a fresh .venv could not run them
# and WAVE-WIDEN-ABSTRACT-MACHINE failed its acceptance on a ModuleNotFoundError, not on its work.
# second and third solvers for python -m rtl.formal (WAVE-FORMAL-PROOFS-ON-VERILOG): boolector runs everywhere (WebAssembly); the yices wheel
# carries a native binary for Linux x86-64 only, so a Mac runs z3 and boolector and says so in the output.
dev = ["pytest>=7", "z3-solver>=4.12", "yowasp-yosys>=0.50", "yowasp-boolector>=3.2",
       "yices-solver>=2.6; platform_system == 'Linux' and platform_machine == 'x86_64'"]

[project.scripts]
govsim = "govsim.cli:main"

[tool.setuptools.packages.find]
include = ["govsim*", "rtl*"]

[tool.pytest.ini_options]
addopts = "-q"
